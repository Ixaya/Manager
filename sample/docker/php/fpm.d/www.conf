; PHP-FPM pool. PM values come from the environment at start (no rebuild):
; the entrypoint validates PHP_PM_MODE/PHP_PM_MAX_CHILDREN and derives the
; start/spare values; the defaults here are what an unset value gets.
; No user/group: FPM runs as the container's own user (compose `user:`).
; Listens on TCP 9000 (not a unix socket) so nginx, in a separate container,
; can reach it.

[www]
listen       = 0.0.0.0:9000

; ── Process manager ───────────────────────────────────────────────────────────
; start/spare apply to dynamic only; process_idle_timeout to ondemand only.
; Defaults keep in sync with docker-compose.yml (mode, max_children) and the
; entrypoint's derivation from max_children (start, spares).
pm                   = ${PHP_PM_MODE:-dynamic}
pm.max_children      = ${PHP_PM_MAX_CHILDREN:-20}
pm.start_servers     = ${PHP_PM_START_SERVERS:-7}
pm.min_spare_servers = ${PHP_PM_MIN_SPARE:-5}
pm.max_spare_servers = ${PHP_PM_MAX_SPARE:-10}
pm.process_idle_timeout = 10s
pm.max_requests      = 500

; Backstop for workers stuck on a slow query (max_execution_time only counts
; CPU time, not blocked I/O). Must stay ABOVE nginx's fastcgi_read_timeout
; (currently 60s) so nginx normally times out first.
request_terminate_timeout = 65s

; ── Health / status endpoints (used by the Docker HEALTHCHECK) ─────────────────
ping.path      = /ping
ping.response  = pong
pm.status_path = /status

; ── Logging → container stdout/stderr (captured by the json-file driver) ───────
access.log              = /proc/self/fd/2
; nginx rewrites every URL to /index.php?/<path>, which leaves FPM's own %r
; empty; REQUEST_URI/REMOTE_ADDR are the client's, as nginx passes them.
access.format           = "%{REMOTE_ADDR}e - %u %t \"%m %{REQUEST_URI}e\" %s %{milli}dms %{kilo}MKB %C%%"
; The healthcheck hits /ping every interval; keep it out of the access log.
access.suppress_path[]  = /ping
catch_workers_output    = yes
decorate_workers_output = no

; Pass container environment (DB_*, LIB_REDIS_*, CF_*, ...) through to PHP.
; Secrets are NOT in the container environment — they are read by the app from
; the mounted /var/www/html/.env.priv file.
clear_env = no
