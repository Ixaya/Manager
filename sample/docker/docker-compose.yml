# manager sample — Docker stack. ALWAYS invoke via ../docker_manage.sh, never
# `docker compose` directly:
#
#   ./docker_manage.sh -e <instance> build
#   ./docker_manage.sh -e <instance> up -d
#   ./docker_manage.sh -e <instance> --profile ws --profile cron up -d
#
# Core services (always on): php, nginx, valkey-state, valkey-cache, plus
# the one-shot init.
# Profiles: ws | cron | mysql | mariadb | postgres | mssql | cli.
# Only nginx publishes ports; Valkey is never exposed to the host.

# ── Reusable fragments ────────────────────────────────────────────────────────
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &security
  security_opt:
    - no-new-privileges:true

# Optional parent cgroup shared by every container of every instance, so one
# host-level memory cap bounds the whole fleet. Empty = Docker's default.
x-fleet: &fleet
  cgroup_parent: ${CGROUP_PARENT:-}

# Common wiring for the four services that run the php-app image.
x-app-image: &app-image
  image: ${IMAGE_REPO:-manager/app}:${IMAGE_TAG:-latest}
  # Base non-secret config from ../.env.<instance> (single source = root
  # .env.sample), then the docker overrides. LAST file wins.
  env_file:
    - ${APP_BASE_ENV_FILE:-../.env.dev}
    - ${APP_ENV_FILE:-env/dev.env}
  networks: [appnet]
  logging: *logging
  <<: [*security, *fleet]
  # Numeric or named; a name must exist in the image, a number needn't.
  user: "${APP_USER:-www-data}:${APP_GROUP:-www-data}"

services:

  # ── Init: log-volume ownership (core, one-shot) ───────────────────────────
  # The stack's only root step. Mounts nothing but manager-logs, so bind
  # mounts, secrets and .env.priv stay out of its reach.
  init:
    image: ${IMAGE_REPO:-manager/app}:${IMAGE_TAG:-latest}
    user: "0:0"
    restart: "no"
    network_mode: none
    logging: *logging
    <<: [*security, *fleet]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mkdir -p /var/log/manager/app /var/log/manager/cli /var/log/manager/cron &&
        find /var/log/manager \( \! -user "${APP_USER:-www-data}" -o \! -group "${APP_GROUP:-www-data}" \)
        -exec chown "${APP_USER:-www-data}:${APP_GROUP:-www-data}" {} +
    volumes:
      - manager-logs:/var/log/manager
    read_only: true
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      disable: true

  # ── PHP-FPM (core) ────────────────────────────────────────────────────────
  php:
    <<: *app-image
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: php-app
      args:
        # Baked in at build time — changing this value rebuilds the image.
        PHP_PM_MAX_CHILDREN: ${PHP_PM_MAX_CHILDREN:-20}
        PHP_PM_MODE: ${PHP_PM_MODE:-dynamic}
        # Bakes the opt-in smoke-test module into the image; false by default.
        INCLUDE_SMOKE_MODULE: ${INCLUDE_SMOKE_MODULE:-false}
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      # Non-secret runtime knobs. App SECRETS come from the mounted .env.priv.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      WAIT_FOR_DB:    ${WAIT_FOR_DB:-false}
    volumes:
      - ${APP_SECRETS_MOUNT:-./env/dev.priv.env}:/var/www/html/.env.priv:ro
      - manager-logs:/var/log/manager
      - ${MEDIA_PATH:-../public/media}:/var/www/html/public/media
      - ${PRIVATE_PATH:-../private}:/var/www/html/private
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${PHP_MEM_LIMIT:-1024m}
    memswap_limit: ${PHP_MEM_LIMIT:-1024m}
    cpus: ${PHP_CPUS:-2.0}
    depends_on:
      init:         { condition: service_completed_successfully }
      valkey-state: { condition: service_healthy }
      valkey-cache: { condition: service_healthy }
    # Overrides the baked-in HEALTHCHECK so the interval follows
    # HEALTHCHECK_INTERVAL like every other service, without a rebuild.
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>&1 | grep -q pong || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Nginx (core) ──────────────────────────────────────────────────────────
  nginx:
    image: ${IMAGE_REPO_NGINX:-manager/app-nginx}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: nginx-app
    restart: unless-stopped
    networks: [appnet]
    logging: *logging
    <<: [*security, *fleet]
    # Published ports bypass host firewall INPUT rules; PUBLISH_IP narrows them.
    ports:
      - "${PUBLISH_IP:+${PUBLISH_IP}:}${HTTP_PORT:?HTTP_PORT is required}:80"
      - "${PUBLISH_IP:+${PUBLISH_IP}:}${WS_PORT:?WS_PORT is required}:8080"
    volumes:
      # Serve uploaded media directly (read-only is enough for nginx).
      - ${MEDIA_PATH:-../public/media}:/var/www/html/public/media:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    memswap_limit: ${NGINX_MEM_LIMIT:-128m}
    cpus: ${NGINX_CPUS:-1.0}
    # Container FD ceiling — must stay ≥ nginx.conf `worker_rlimit_nofile`
    # (4096) so nginx can actually apply it; raise both together. Set explicitly
    # (not left to the host default) so the limit is deterministic across hosts.
    ulimits:
      nofile:
        soft: ${NGINX_NOFILE:-8192}
        hard: ${NGINX_NOFILE:-8192}
    depends_on:
      php: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Valkey: durable state (core) ──────────────────────────────────────────
  valkey-state:
    image: valkey/valkey:8.1.10-alpine3.24
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/valkey-entrypoint.sh"]
    command: ["/etc/valkey/valkey.conf", "--maxmemory", "${VALKEY_STATE_MAXMEMORY:-128mb}"]
    networks: [appnet]
    logging: *logging
    <<: [*security, *fleet]
    volumes:
      - ./valkey/entrypoint.sh:/usr/local/bin/valkey-entrypoint.sh:ro
      - ./valkey/valkey-state.conf:/etc/valkey/valkey.conf:ro
      - valkey-state-data:/data
    secrets:
      - valkey_password
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${VALKEY_STATE_MEM_LIMIT:-320m}
    memswap_limit: ${VALKEY_STATE_MEM_LIMIT:-320m}
    cpus: ${VALKEY_STATE_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/valkey_password) valkey-cli ping | grep -q PONG"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Valkey: ephemeral cache/queues/pub-sub (core) ──────────────────────────
  valkey-cache:
    image: valkey/valkey:8.1.10-alpine3.24
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/valkey-entrypoint.sh"]
    command: ["/etc/valkey/valkey.conf", "--maxmemory", "${VALKEY_CACHE_MAXMEMORY:-128mb}"]
    networks: [appnet]
    logging: *logging
    <<: [*security, *fleet]
    volumes:
      - ./valkey/entrypoint.sh:/usr/local/bin/valkey-entrypoint.sh:ro
      - ./valkey/valkey-cache.conf:/etc/valkey/valkey.conf:ro
    secrets:
      - valkey_password
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${VALKEY_CACHE_MEM_LIMIT:-256m}
    memswap_limit: ${VALKEY_CACHE_MEM_LIMIT:-256m}
    cpus: ${VALKEY_CACHE_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/valkey_password) valkey-cli ping | grep -q PONG"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── WebSocket server (profile: ws) ─────────────────────────────────────────
  ws:
    <<: *app-image
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["bash", "/var/www/html/bin/cli_run.sh", "manager", "websockets", "serve"]
    environment:
      RUN_MIGRATIONS: "false"
      WAIT_FOR_DB:    ${WAIT_FOR_DB:-false}
    volumes:
      - ${APP_SECRETS_MOUNT:-./env/dev.priv.env}:/var/www/html/.env.priv:ro
      - manager-logs:/var/log/manager
      - ${PRIVATE_PATH:-../private}:/var/www/html/private
    tmpfs:
      - /tmp
    mem_limit: ${WS_MEM_LIMIT:-256m}
    memswap_limit: ${WS_MEM_LIMIT:-256m}
    cpus: ${WS_CPUS:-1.0}
    depends_on:
      init:         { condition: service_completed_successfully }
      php:          { condition: service_healthy }
      valkey-cache: { condition: service_healthy }
    healthcheck:
      # /dev/tcp is a bash builtin; the image's /bin/sh is busybox ash, so run
      # the check explicitly under bash. Port is interpolated at compose time.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${WEBSOCKET_PORT:-9008}"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles: [ws]

  # ── Cron: supercronic (profile: cron) ──────────────────────────────────────
  cron:
    <<: *app-image
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["/usr/local/bin/supercronic"]
    command: ["/etc/supercronic/crontab"]
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ${APP_SECRETS_MOUNT:-./env/dev.priv.env}:/var/www/html/.env.priv:ro
      - ./cron/crontab:/etc/supercronic/crontab:ro
      - manager-logs:/var/log/manager
      - ${PRIVATE_PATH:-../private}:/var/www/html/private
    tmpfs:
      - /tmp
    mem_limit: ${CRON_MEM_LIMIT:-256m}
    memswap_limit: ${CRON_MEM_LIMIT:-256m}
    cpus: ${CRON_CPUS:-0.5}
    depends_on:
      init:         { condition: service_completed_successfully }
      php:          { condition: service_healthy }
      valkey-cache: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep supercronic >/dev/null 2>&1 || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles: [cron]

  # ── CLI: one-off commands / interactive shell (profile: cli) ───────────────
  cli:
    <<: *app-image
    working_dir: /var/www/html
    entrypoint: ["bash"]
    stdin_open: true
    tty: true
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ${APP_SECRETS_MOUNT:-./env/dev.priv.env}:/var/www/html/.env.priv:ro
      - manager-logs:/var/log/manager
      - ${MEDIA_PATH:-../public/media}:/var/www/html/public/media
      - ${PRIVATE_PATH:-../private}:/var/www/html/private
    tmpfs:
      - /tmp
    mem_limit: ${CLI_MEM_LIMIT:-512m}
    memswap_limit: ${CLI_MEM_LIMIT:-512m}
    cpus: ${CLI_CPUS:-1.0}
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      disable: true
    profiles: [cli]

  # ── Tools: composer/phpstan/phpunit on the host tree (profile: tools) ──────
  # Reuses the vendor-builder stage (composer + the exact runtime PHP and
  # extensions). Mounts the project tree at /work — NOT over /var/www/html —
  # so the runtime services' baked --no-dev vendor/ is never touched. Never
  # started by `up` (profile-gated); invoke via `run`:
  #   ./docker_manage.sh -e <i> run --rm tools composer install
  #   ./docker_manage.sh -e <i> run --rm tools vendor/bin/phpstan analyse
  tools:
    image: ${IMAGE_REPO:-manager/app}-tools:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: vendor-builder
    working_dir: /work
    networks: [appnet]
    logging: *logging
    <<: [*security, *fleet]
    volumes:
      - ${TOOLS_BIND_PATH:-..}:/work
      - composer-cache:/root/.composer/cache
    mem_limit: ${TOOLS_MEM_LIMIT:-2048m}
    memswap_limit: ${TOOLS_MEM_LIMIT:-2048m}
    cpus: ${TOOLS_CPUS:-2.0}
    healthcheck:
      disable: true
    profiles: [tools]

  # ── MySQL (profile: mysql — dev/local only) ────────────────────────────────
  # Aurora-compatible profile — use when parity with the Aurora MySQL
  # dev/prod server matters. DB_USER/DB_NAME must be set in the env-file
  # (no default) — passwords come from Docker secrets, never env.
  mysql:
    image: mysql:8.4.11-oraclelinux9
    restart: unless-stopped
    networks: [appnet]
    logging: *logging
    <<: [*security, *fleet]
    environment:
      MYSQL_DATABASE:           ${DB_NAME:?DB_NAME is required for the mysql profile}
      MYSQL_USER:               ${DB_USER:?DB_USER is required for the mysql profile}
      MYSQL_PASSWORD_FILE:      /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    # Sized knobs come from docker.env and must fit inside MYSQL_MEM_LIMIT —
    # mysqld never reads its cgroup limit, it only gets killed at it.
    # temptable-max-ram is one server-wide pool; past it, temp tables spill to disk.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-128M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-30}
      - --temptable-max-ram=${MYSQL_TEMPTABLE_MAX_RAM:-64M}
      - --performance-schema=${MYSQL_PERFORMANCE_SCHEMA:-OFF}
      - --innodb-log-buffer-size=16M
      # Dev-only profile, no replicas: stock binlogs keep 30 days on disk.
      - --disable-log-bin
    volumes:
      - mysql-data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    mem_limit: ${MYSQL_MEM_LIMIT:-512m}
    memswap_limit: ${MYSQL_MEM_LIMIT:-512m}
    cpus: ${MYSQL_CPUS:-1.0}
    healthcheck:
      # `mysqladmin ping` reports the server as alive without needing creds.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 3
      start_period: 30s
    profiles: [mysql]

  # ── MariaDB (profile: mariadb — dev/local only) ────────────────────────────
  # Lighter local alternative to mysql — NOT Aurora-compatible. Same
  # secrets pattern as mysql above.
  mariadb:
    image: mariadb:12.3.2-noble
    restart: unless-stopped
    networks: [appnet]
    logging: *logging
    <<: [*security, *fleet]
    environment:
      MARIADB_DATABASE:           ${DB_NAME:?DB_NAME is required for the mariadb profile}
      MARIADB_USER:               ${DB_USER:?DB_USER is required for the mariadb profile}
      MARIADB_PASSWORD_FILE:      /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      # The healthcheck below needs it: on a datadir created without the
      # healthcheck user, only this flag makes the entrypoint create one. Also
      # runs mariadb-upgrade (system tables backed up first) after a version bump.
      MARIADB_AUTO_UPGRADE:       "1"
    # Sized knobs come from docker.env and must fit inside MARIADB_MEM_LIMIT.
    # tmp_table_size is PER SESSION (unlike MySQL's global temptable pool):
    # concurrent sessions × it must fit too. key_buffer is MyISAM-only.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MARIADB_INNODB_BUFFER_POOL_SIZE:-128M}
      - --max-connections=${MARIADB_MAX_CONNECTIONS:-30}
      - --tmp-table-size=${MARIADB_TMP_TABLE_SIZE:-4M}
      - --max-heap-table-size=${MARIADB_TMP_TABLE_SIZE:-4M}
      - --key-buffer-size=8M
      - --aria-pagecache-buffer-size=16M
    volumes:
      - mariadb-data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    mem_limit: ${MARIADB_MEM_LIMIT:-640m}
    memswap_limit: ${MARIADB_MEM_LIMIT:-640m}
    cpus: ${MARIADB_CPUS:-1.0}
    healthcheck:
      # The image's own check, authenticating as its USAGE-only healthcheck
      # user — a credential-less ping logs "Access denied" on every run.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 3
      start_period: 30s
    profiles: [mariadb]

  # ── PostgreSQL (profile: postgres — dev/local only) ────────────────────────
  # 18+ images require the volume mounted at the PARENT dir
  # (/var/lib/postgresql), not .../data — that's the pre-18 convention and
  # trips this image's startup guard.
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    networks: [appnet]
    logging: *logging
    <<: [*security, *fleet]
    environment:
      POSTGRES_DB:            ${DB_NAME:?DB_NAME is required for the postgres profile}
      POSTGRES_USER:          ${DB_USER:?DB_USER is required for the postgres profile}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ:   UTC
      PGTZ: UTC
    # Sized knobs come from docker.env and must fit inside POSTGRES_MEM_LIMIT.
    # work_mem is per sort/hash node per process, and each parallel worker is
    # another process; effective_cache_size is a planner hint only.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-256MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-30}
      - -c
      - max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-0}
    volumes:
      - postgres-data:/var/lib/postgresql
    secrets:
      - db_password
    # /dev/shm backs parallel-query shared memory (Docker's stock 64m is too
    # small for it); its pages count against mem_limit.
    shm_size: ${POSTGRES_SHM_SIZE:-128m}
    mem_limit: ${POSTGRES_MEM_LIMIT:-640m}
    memswap_limit: ${POSTGRES_MEM_LIMIT:-640m}
    cpus: ${POSTGRES_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is required for the postgres profile} -d ${DB_NAME} || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 3
      start_period: 30s
    profiles: [postgres]

  # ── SQL Server (profile: mssql — dev/local only, PDO path only) ───────────
  # amd64-only — Apple Silicon needs Rosetta/QEMU emulation.
  # The php image ships no SQL Server driver: add pdo_dblib to the Dockerfile
  # (or move to a glibc base for Microsoft's pdo_sqlsrv) before anything can
  # connect — the engine comes up healthy either way, so the failure shows up
  # as "could not find driver" on the first query, not here.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: unless-stopped
    networks: [appnet]
    logging: *logging
    <<: [*security, *fleet]
    environment:
      ACCEPT_EULA:            "Y"
      MSSQL_SA_PASSWORD_FILE: /run/secrets/db_password
      # Engine memory ceiling; must stay below MSSQL_MEM_LIMIT.
      MSSQL_MEMORY_LIMIT_MB:  ${MSSQL_MEMORY_LIMIT_MB:-1536}
    volumes:
      - mssql-data:/var/opt/mssql
    secrets:
      - db_password
    mem_limit: ${MSSQL_MEM_LIMIT:-2048m}
    memswap_limit: ${MSSQL_MEM_LIMIT:-2048m}
    cpus: ${MSSQL_CPUS:-2.0}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$(cat /run/secrets/db_password)\" -Q 'SELECT 1' || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 3
      start_period: 45s
    profiles: [mssql]

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  manager-logs:      # unified Manager logs (/var/log/manager: app/, cli/ subdirs)
  composer-cache:    # tools service only — speeds up repeated composer installs
  valkey-state-data: # AOF/RDB for durable Valkey — cache has NO volume by design
  mysql-data:
  mariadb-data:
  postgres-data:
  mssql-data:

# ── Networks ──────────────────────────────────────────────────────────────────
# Single private bridge, namespaced per instance via `-p <instance>` — only
# nginx publishes host ports.
networks:
  appnet:
    driver: bridge

# ── Secrets ───────────────────────────────────────────────────────────────────
# Valkey password: file provider, path supplied per-instance by
# docker_manage.sh, mounted read-only at /run/secrets/valkey_password.
secrets:
  valkey_password:
    file: ${VALKEY_SECRET_FILE:-secrets/dev.valkey_password}
  # DB secrets are only consumed by the mysql/postgres dev profiles; the files
  # are not required for a core (external-DB) instance.
  db_password:
    file: ${DB_PASSWORD_FILE:-secrets/dev.db_password}
  db_root_password:
    file: ${DB_ROOT_PASSWORD_FILE:-secrets/dev.db_root_password}
